<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة موحدة للفرص الاستثمارية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/site.css" />

    <!-- Preload the data alongside the stylesheet rather than waiting for app.js
         to parse. plots.json is the critical path: ~277 KB gzipped. -->
    <link rel="preload" href="data/meta.json" as="fetch" crossorigin />
    <link rel="preload" href="data/plots.json" as="fetch" crossorigin />
</head>

<body>
    <main role="main">
        <div class="home-page" dir="rtl">

            <div class="dashboard-section" id="dashboardSection">
                <div class="dashboard-container">
                    <div class="dashboard-header">
                        <button class="toggle-dashboard-btn" id="toggleDashboard" type="button" title="إخفاء اللوحة"
                            aria-label="إخفاء لوحة التحكم" aria-expanded="true" aria-controls="dashboardSection">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" aria-hidden="true">
                                <polyline points="18 15 12 9 6 15" />
                            </svg>
                        </button>
                        <h1>لوحة موحدة للفرص الاستثمارية</h1>
                        <p class="subtitle">إجمالي الأراضي: <span id="totalPlots">…</span> قطعة</p>
                    </div>
                    <!-- Cards are rendered from data/meta.json, with a leading
                         "الكل" card so the rent filter can be cleared directly. -->
                    <div class="cards-grid" id="cardsGrid"></div>
                </div>
            </div>

            <div class="map-section">
                <aside class="filters-sidebar" id="filtersSidebar">
                    <div class="sidebar-header">
                        <h2>تصفية الأراضي</h2>
                        <button class="toggle-sidebar-btn" id="toggleSidebar" type="button" title="إخفاء"
                            aria-label="إخفاء لوحة التصفية" aria-expanded="true" aria-controls="filtersSidebar">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" aria-hidden="true">
                                <polyline points="15 18 9 12 15 6" />
                            </svg>
                        </button>
                    </div>

                    <form id="filterForm">
                        <input type="hidden" id="rentStatus" value="" />

                        <div class="filter-group">
                            <label for="district">الحي</label>
                            <select id="district" name="disName" class="filter-select">
                                <option value="">الكل</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label for="mainActivity">النشاط الرئيسي</label>
                            <select id="mainActivity" name="mainActivity" class="filter-select">
                                <option value="">الكل</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label for="subActivity">النشاط الفرعي</label>
                            <select id="subActivity" name="subActivity" class="filter-select">
                                <option value="">الكل</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label for="minArea">المساحة (م²)</label>
                            <div class="range-inputs">
                                <input type="number" id="minArea" name="minArea" placeholder="من" step="1"
                                    aria-label="أقل مساحة" />
                                <span aria-hidden="true">-</span>
                                <input type="number" id="maxArea" name="maxArea" placeholder="إلى" step="1"
                                    aria-label="أكبر مساحة" />
                            </div>
                            <div class="range-labels">
                                <small>الحد الأدنى: <span id="areaMinLabel">…</span></small>
                                <small>الحد الأقصى: <span id="areaMaxLabel">…</span></small>
                            </div>
                            <p class="field-warning" id="areaWarning" role="status" hidden>
                                تم عكس الحدين لأن القيمة الأولى أكبر من الثانية.
                            </p>
                        </div>

                        <div class="filter-actions">
                            <button type="submit" class="btn btn-primary">تطبيق</button>
                            <button type="button" class="btn btn-secondary" id="resetFilters">إعادة تعيين</button>
                        </div>
                    </form>

                    <!-- Sub-activity breakdown. Lives in the sidebar rather than the
                         dashboard: it scrolls, it sits beside the other analysis
                         controls, and it survives the dashboard being collapsed. -->
                    <section class="chart-panel" aria-labelledby="chartHeading">
                        <div class="chart-header">
                            <h3 id="chartHeading">النشاط الفرعي</h3>
                            <button type="button" class="chart-metric" id="chartMetric"
                                title="التبديل بين العدد والمساحة">حسب العدد</button>
                        </div>
                        <div class="chart" id="chart"></div>
                    </section>

                    <div class="results-count" aria-live="polite">
                        <span>عدد النتائج: <strong id="resultsCount">0</strong></span>
                        <small id="resultsDrawn" hidden></small>
                    </div>
                </aside>

                <div class="map-container">
                    <button class="show-sidebar-btn" id="showSidebar" type="button" title="إظهار الفلاتر"
                        aria-label="إظهار لوحة التصفية" style="display:none;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" aria-hidden="true">
                            <polyline points="9 18 15 12 9 6" />
                        </svg>
                    </button>
                    <button class="show-dashboard-btn" id="showDashboard" type="button" title="إظهار اللوحة"
                        aria-label="إظهار لوحة التحكم" style="display:none;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" aria-hidden="true">
                            <polyline points="6 9 12 15 18 9" />
                        </svg>
                        <span>لوحة التحكم</span>
                    </button>

                    <div id="map"></div>

                    <!-- Colour key: the dashboard cards are the only other place the
                         palette is explained, and they collapse. -->
                    <div class="map-legend" id="mapLegend" aria-label="مفتاح الألوان"></div>

                    <div class="empty-state" id="emptyState" role="status" hidden>
                        <strong>لا توجد نتائج مطابقة</strong>
                        <span>جرّب توسيع نطاق التصفية.</span>
                        <button type="button" class="btn btn-secondary" id="emptyReset">إعادة تعيين</button>
                    </div>

                    <div class="app-status" id="appStatus" role="status" aria-live="polite">
                        جارٍ تحميل بيانات الأراضي…</div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script type="module" src="js/app.js"></script>
    <!-- AI assistant. Its widget is built in JS and appended to <body>. The LLM
         call is proxied through /api/chat (which holds the OpenRouter key). -->
    <script type="module" src="js/chat.js"></script>
</body>

</html>
